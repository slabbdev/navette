[package]
name = "navette"
version = "1.2.1"
edition = "2021"
description = "The browser for agents — one tiny binary driving the WebView your OS already ships."
license = "MIT"

[dependencies]
serde = "1"
serde_json = "1"
png = "0.17"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
core-graphics = "0.24"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
wry = "0.57"
tao = "0.30"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
