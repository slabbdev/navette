[package]
name = "navette-browser"
version = "1.9.0"
edition = "2021"
description = "The browser for agents — one tiny binary driving the WebView your OS already ships."
license = "MIT"
repository = "https://github.com/slabbdev/navette"
readme = "README.md"
keywords = ["mcp", "agent", "webview", "browser", "automation"]
categories = ["web-programming", "development-tools"]
rust-version = "1.75"

# The product binary is `navette`; the crates.io package carries a
# disambiguating name (`cargo install navette-browser` gives you `navette`).
[[bin]]
name = "navette"
path = "src/main.rs"

[dependencies]
serde = "1"
serde_json = "1"
png = "0.17"
base64 = "0.22"
# `navette creds set` reads the password on hidden stdin — never argv, never env.
rpassword = "7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Per-OS credential store for the session-state keychain (#8). The platform
# feature must be named explicitly — keyring's defaults enable NONE, and the
# silent in-memory mock that remains is exactly what keystore refuses to use.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
core-graphics = { version = "0.24", features = ["elcapitan"] }
foreign-types = "0.5"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
wry = "0.57"
tao = "0.30"
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
gtk = "0.18"
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_Xps",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
