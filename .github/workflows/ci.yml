name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: smoke
        shell: bash
        run: |
          RUST_BACKTRACE=1 sh -c './target/release/navette serve --port 8765; exit 0' > serve.log 2>&1 &
          sleep 3
          cat serve.log
          curl -sf http://127.0.0.1:8765/health | grep -q '"ok"'
          RESP=$(curl -sf -X POST http://127.0.0.1:8765/navigate -H 'Content-Type: application/json' \
            -d '{"url":"file://${{ github.workspace }}/test/smoke-page.html","with_content":true}') || RESP="CURL_FAILED"
          echo "$RESP" | grep -q 'Example Domain' || { echo "NAV RESPONSE: $RESP"; echo "--- serve.log ---"; cat serve.log; exit 1; }
          echo "macOS smoke OK"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: ensure WebView2 runtime
        shell: pwsh
        run: |
          $present = Test-Path "C:\Program Files (x86)\Microsoft\EdgeWebView\Application"
          if (-not $present) {
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile webview2bootstrapper.exe
            Start-Process -FilePath "./webview2bootstrapper.exe" -ArgumentList "/silent","/install" -Wait
          } else { Write-Host "WebView2 runtime present" }
      - run: cargo build --release
      - name: smoke
        shell: bash
        run: |
          RUST_BACKTRACE=1 sh -c './target/release/navette.exe serve --port 8765; exit 0' > serve.log 2>&1 &
          sleep 5
          cat serve.log
          curl -sf http://127.0.0.1:8765/health | grep -q '"ok"'
          RESP=$(curl -sf -X POST http://127.0.0.1:8765/navigate -H 'Content-Type: application/json' \
            -d '{"url":"file://${{ github.workspace }}/test/smoke-page.html","with_content":true}') || RESP="CURL_FAILED"
          echo "$RESP" | grep -q 'Example Domain' || { echo "NAV RESPONSE: $RESP"; echo "--- serve.log ---"; cat serve.log; exit 1; }
          taskkill /IM navette.exe || true
          taskkill /IM msedgewebview2.exe || true
          echo "Windows smoke OK"

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev glib-networking xvfb curl
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: smoke
        shell: bash
        run: |
          RUST_BACKTRACE=1 WEBKIT_FORCE_SANDBOX=0 WEBKIT_DISABLE_DMABUF_RENDERER=1 GDK_PLATFORM=x11 xvfb-run -a -s "-screen 0 1280x800x24" sh -c './target/release/navette serve --port 8765; exit 0' > serve.log 2>&1 &
          sleep 5
          cat serve.log
          curl -sf http://127.0.0.1:8765/health | grep -q '"ok"'
          RESP=$(curl -sf -X POST http://127.0.0.1:8765/navigate -H 'Content-Type: application/json' \
            -d '{"url":"file://${{ github.workspace }}/test/smoke-page.html","with_content":true}') || RESP="CURL_FAILED"
          echo "$RESP" | grep -q 'Example Domain' || { echo "NAV RESPONSE: $RESP"; echo "--- serve.log ---"; cat serve.log; exit 1; }
          pkill -x navette || true
          pkill -f WebKit || true
          pkill -x Xvfb || true
          echo "Linux smoke OK"
