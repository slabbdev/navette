name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: smoke
        shell: bash
        run: |
          ./target/release/navette serve --port 8765 &
          sleep 3
          curl -sf http://127.0.0.1:8765/health | grep -q '"ok"'
          RESP=$(curl -sf -X POST http://127.0.0.1:8765/navigate -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com","with_content":true}') || RESP="CURL_FAILED"
          echo "$RESP" | grep -q 'Example Domain' || { echo "NAV RESPONSE: $RESP"; exit 1; }
          echo "macOS smoke OK"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: smoke
        shell: bash
        run: |
          ./target/release/navette.exe serve --port 8765 &
          sleep 5
          curl -sf http://127.0.0.1:8765/health | grep -q '"ok"'
          RESP=$(curl -sf -X POST http://127.0.0.1:8765/navigate -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com","with_content":true}') || RESP="CURL_FAILED"
          echo "$RESP" | grep -q 'Example Domain' || { echo "NAV RESPONSE: $RESP"; exit 1; }
          echo "Windows smoke OK"

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb curl
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: smoke
        shell: bash
        run: |
          xvfb-run -a ./target/release/navette serve --port 8765 &
          sleep 5
          curl -sf http://127.0.0.1:8765/health | grep -q '"ok"'
          RESP=$(curl -sf -X POST http://127.0.0.1:8765/navigate -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com","with_content":true}') || RESP="CURL_FAILED"
          echo "$RESP" | grep -q 'Example Domain' || { echo "NAV RESPONSE: $RESP"; exit 1; }
          echo "Linux smoke OK"
