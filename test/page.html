<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>navette — test target</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, "SF Pro Text", sans-serif;
    background: linear-gradient(160deg, #0f1420 0%, #1a2236 100%);
    color: #e8ecf4; min-height: 100vh;
    display: grid; place-items: center;
  }
  .card {
    width: 560px; background: #171e2e; border: 1px solid #2a3550;
    border-radius: 16px; padding: 36px; box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  h1 .shuttle { color: #6ea8ff; }
  p.sub { color: #8b96ad; font-size: 13px; margin-bottom: 24px; }
  label { display: block; font-size: 12px; color: #8b96ad; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .06em; }
  input, textarea, select {
    width: 100%; background: #0e1320; color: #e8ecf4; border: 1px solid #2a3550;
    border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit;
  }
  input:focus, textarea:focus { outline: none; border-color: #6ea8ff; }
  textarea { height: 70px; resize: none; }
  button {
    margin-top: 22px; width: 100%; padding: 12px; border: 0; border-radius: 8px;
    background: #3b82f6; color: white; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #2f6fe0; }
  #result {
    display: none; margin-top: 20px; padding: 14px 16px; border-radius: 10px;
    background: #10331c; border: 1px solid #1f7a3d; color: #8ff0b0; font-size: 14px;
  }
  #result.show { display: block; }
</style>
</head>
<body>
  <div class="card">
    <h1><span class="shuttle">⇄</span> navette — test target</h1>
    <p class="sub">The browser that hates the nav must fill this form like a human.</p>
    <form id="f">
      <label for="name">Name</label>
      <input id="name" name="name" placeholder="Your name">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com">
      <label for="os">System engine</label>
      <select id="os" name="os">
        <option>WKWebView (macOS)</option>
        <option>WebView2 (Windows)</option>
        <option>WebKitGTK (Linux)</option>
      </select>
      <label for="msg">Message</label>
      <textarea id="msg" name="msg" placeholder="Say hi to the shuttle"></textarea>
      <button id="go" type="submit">Send</button>
    </form>
    <div id="result"></div>
  </div>
  <script>
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var name = document.getElementById('name').value;
      var os = document.getElementById('os').value;
      var r = document.getElementById('result');
      r.classList.add('show');
      r.textContent = 'Welcome ' + name + ' — form filled like a human, on ' + os + '.';
      document.querySelector('.card').style.borderColor = '#1f7a3d';
    });
  </script>
</body>
</html>
